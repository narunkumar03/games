<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match - Kids Game</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FFF8F0;--panel:#FFFFFF;--ink:#2D2A3E;--muted:#7B7599;--accent:#FF6B6B;--green:#36C48A;--yellow:#FFD166;--radius:20px;--shadow:0 8px 32px rgba(45,42,62,.12)}
html,body{height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#cc{position:fixed;inset:0;pointer-events:none;z-index:999}
header{text-align:center;padding:22px 16px 0}
header h1{font-size:clamp(1.8rem,6vw,3rem);font-weight:900;background:linear-gradient(135deg,#FF6B6B,#845EF7,#36C48A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--muted);font-size:1rem;margin-top:4px}
#scorebar{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:14px 16px 0}
.stat{background:var(--panel);border-radius:14px;padding:8px 18px;box-shadow:var(--shadow);text-align:center;min-width:76px}
.stat .val{font-size:1.45rem;font-weight:900;line-height:1}
.stat .lbl{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
#sv{color:#FF6B6B}#mv{color:#845EF7}#tv{color:#36C48A}

#gc{max-width:560px;margin:18px auto;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px 24px;text-align:center}
#lb{display:inline-block;background:#FFD166;color:var(--ink);font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;padding:4px 12px;border-radius:99px;margin-bottom:8px}
#instr{font-size:1.05rem;font-weight:800;margin-bottom:16px}

#board{
  display:grid;gap:10px;justify-content:center;
  margin:0 auto 8px;
  perspective:800px;
}
.card{
  width:100%;aspect-ratio:1/1;
  position:relative;cursor:pointer;
}
.card-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,.2,.2,1);
}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card.matched .card-inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.face-back{
  background:linear-gradient(135deg,#845EF7,#6741d9);
  font-size:1.8rem;color:#fff;
}
.face-front{
  background:#fff;
  transform:rotateY(180deg);
  font-size:2rem;
  border:3px solid #EDE9F6;
}
.card.matched .face-front{
  border-color:var(--green);
  background:#EAFBF2;
}
.card.wrong .card-inner{animation:shake .4s}
@keyframes shake{
  0%,100%{transform:rotateY(180deg) translateX(0)}
  20%{transform:rotateY(180deg) translateX(-6px)}
  40%{transform:rotateY(180deg) translateX(6px)}
  60%{transform:rotateY(180deg) translateX(-4px)}
  80%{transform:rotateY(180deg) translateX(4px)}
}
.card.pop .card-inner{animation:pop .35s ease}
@keyframes pop{
  0%{transform:rotateY(180deg) scale(1)}
  50%{transform:rotateY(180deg) scale(1.12)}
  100%{transform:rotateY(180deg) scale(1)}
}

#feedback{margin-top:16px;font-size:1.1rem;font-weight:800;min-height:1.7em}
#feedback.g{color:var(--green)}#feedback.b{color:var(--accent)}

.ov{display:none;position:fixed;inset:0;background:rgba(45,42,62,.6);z-index:100;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.ob{background:var(--panel);border-radius:24px;padding:34px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.ob h2{font-size:1.85rem;font-weight:900;margin-bottom:8px}
.ob p{color:var(--muted);font-size:1rem;margin-bottom:18px}
.em{font-size:3.5rem;display:block;margin-bottom:10px}
.bp{display:inline-block;background:linear-gradient(135deg,#845EF7,#FF6B6B);color:#fff;font-family:Arial,sans-serif;font-size:1.05rem;font-weight:900;padding:13px 34px;border-radius:14px;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(132,94,247,.35);transition:transform .15s}
.bp:hover{transform:translateY(-2px)}
#rsc{font-size:2.1rem;font-weight:900;color:#FF6B6B}
#rst{font-size:1.9rem;letter-spacing:4px;margin:6px 0 10px}
.dbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.db{padding:9px 20px;border-radius:12px;border:3px solid transparent;font-family:Arial,sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:transform .15s}
.db:hover{transform:scale(1.06)}
.db.on{border-color:#845EF7}
.de{background:#D3F9D8;color:#2b7a3b}
.dm{background:#FFF3BF;color:#7c5a00}
.dh{background:#FFE3E3;color:#9b0000}

@media(max-width:420px){
  .face-back{font-size:1.4rem}
  .face-front{font-size:1.5rem}
}
</style>
</head>
<body>
<canvas id="cc"></canvas>

<div class="ov on" id="ss">
  <div class="ob">
    <span class="em">&#129504;</span>
    <h2>Memory Match!</h2>
    <p>Flip two cards at a time and find all the pairs. Choose your level!</p>
    <div class="dbs">
      <button class="db de on" data-d="easy">&#128522; Easy</button>
      <button class="db dm" data-d="medium">&#128526; Medium</button>
      <button class="db dh" data-d="hard">&#128293; Hard</button>
    </div>
    <button class="bp" id="startBtn">Let's Play! &#128640;</button>
  </div>
</div>

<div class="ov" id="rs">
  <div class="ob">
    <span class="em" id="re">&#127942;</span>
    <h2 id="rt">All Matched!</h2>
    <div id="rst">&#11088;&#11088;&#11088;</div>
    <div id="rsc">0 pts</div>
    <p id="rm">Great job!</p>
    <br>
    <button class="bp" id="againBtn">Play Again &#128260;</button>
  </div>
</div>

<header>
  <h1>&#129504; Memory Match</h1>
  <p>Flip the cards and find the matching pairs!</p>
</header>

<div id="scorebar">
  <div class="stat"><div class="val" id="sv">0</div><div class="lbl">Score</div></div>
  <div class="stat"><div class="val" id="mv">0</div><div class="lbl">Moves</div></div>
  <div class="stat"><div class="val" id="tv">0/0</div><div class="lbl">Pairs</div></div>
</div>

<div id="gc">
  <div id="lb">Easy</div>
  <div id="instr">Tap two cards to flip and find a pair</div>
  <div id="board"></div>
  <div id="feedback"></div>
</div>

<script>
/* ---------- emoji sets ---------- */
var ICON_SETS = {
  easy:   ["\uD83D\uDC36","\uD83D\uDC31","\uD83D\uDC30","\uD83D\uDC38","\uD83E\uDD8A","\uD83D\uDC3B","\uD83E\uDD81","\uD83D\uDC2F"],
  medium: ["\uD83C\uDF4E","\uD83C\uDF4C","\uD83C\uDF47","\uD83C\uDF53","\uD83C\uDF49","\uD83C\uDF51","\uD83C\uDF4D","\uD83C\uDF52","\uD83C\uDF60","\uD83C\uDF4B"],
  hard:   ["\u26BD","\uD83C\uDFC0","\uD83C\uDFBE","\uD83C\uDFC8","\uD83C\uDFD2","\uD83C\uDFD3","\uD83C\uDFB1","\uD83C\uDFF8","\uD83E\uDD4A","\uD83C\uDFF9","\uD83C\uDFB3","\uD83C\uDFCF"]
};

var GRID = {
  easy:   {pairs:6,  cols:4},
  medium: {pairs:8,  cols:4},
  hard:   {pairs:12, cols:6}
};
var BONUS = {easy:15, medium:20, hard:25};
var LABEL = {easy:"Easy", medium:"Medium", hard:"Hard"};

var diff="easy", score=0, moves=0, matchedPairs=0, totalPairs=0, locked=false;
var flipped=[];

function $(id){return document.getElementById(id);}
var boardEl=$("board"), fbEl=$("feedback");
var svEl=$("sv"), mvEl=$("mv"), tvEl=$("tv"), lbEl=$("lb");
var ssEl=$("ss"), rsEl=$("rs");

document.querySelectorAll(".db").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".db").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    diff=b.getAttribute("data-d");
  });
});
$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", function(){
  rsEl.classList.remove("on");
  ssEl.classList.add("on");
});

function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}

function startGame(){
  ssEl.classList.remove("on");
  score=0; moves=0; matchedPairs=0; locked=false; flipped=[];
  var cfg = GRID[diff];
  totalPairs = cfg.pairs;
  lbEl.textContent = LABEL[diff];
  updateHUD();
  buildBoard(cfg);
}

function buildBoard(cfg){
  var icons = ICON_SETS[diff].slice(0, cfg.pairs);
  var deck = shuffle(icons.concat(icons)).map(function(icon,i){
    return {id:i, icon:icon, matched:false};
  });

  boardEl.innerHTML = "";
  boardEl.style.gridTemplateColumns = "repeat(" + cfg.cols + ", 1fr)";
  boardEl.style.maxWidth = (cfg.cols * 78) + "px";

  deck.forEach(function(card){
    var el = document.createElement("div");
    el.className = "card";
    el.dataset.id = card.id;
    el.dataset.icon = card.icon;
    el.innerHTML =
      '<div class="card-inner">'+
        '<div class="face face-back">?</div>'+
        '<div class="face face-front">'+card.icon+'</div>'+
      '</div>';
    el.addEventListener("click", function(){ flipCard(el); });
    boardEl.appendChild(el);
  });
}

function flipCard(el){
  if(locked) return;
  if(el.classList.contains("flipped") || el.classList.contains("matched")) return;
  if(flipped.length >= 2) return;

  el.classList.add("flipped");
  flipped.push(el);
  fbEl.textContent = "";
  fbEl.className = "";

  if(flipped.length === 2){
    moves++;
    updateHUD();
    locked = true;
    var a = flipped[0], b = flipped[1];
    if(a.dataset.icon === b.dataset.icon){
      setTimeout(function(){
        a.classList.add("matched","pop");
        b.classList.add("matched","pop");
        matchedPairs++;
        score += BONUS[diff];
        fbEl.textContent = "Nice match! +" + BONUS[diff] + " pts";
        fbEl.className = "g";
        updateHUD();
        burstAt(a);
        flipped = [];
        locked = false;
        if(matchedPairs === totalPairs){
          setTimeout(endGame, 500);
        }
      }, 350);
    } else {
      setTimeout(function(){
        a.classList.add("wrong");
        b.classList.add("wrong");
        fbEl.textContent = "Not a match - try again!";
        fbEl.className = "b";
      }, 250);
      setTimeout(function(){
        a.classList.remove("flipped","wrong");
        b.classList.remove("flipped","wrong");
        flipped = [];
        locked = false;
      }, 950);
    }
  }
}

function endGame(){
  var efficiency = totalPairs / moves; // 1.0 = perfect
  var stars = efficiency >= 0.75 ? 3 : efficiency >= 0.5 ? 2 : 1;
  var ss=""; for(var i=0;i<3;i++) ss += i<stars ? "\u2B50" : "\u2606";

  $("re").textContent = stars===3 ? "\uD83C\uDFC6" : stars===2 ? "\uD83D\uDE0A" : "\uD83D\uDE05";
  $("rt").textContent = "All Matched!";
  $("rst").textContent = ss;
  $("rsc").textContent = score + " pts";
  $("rm").textContent = stars===3 ? "Incredible memory! Every move counted!" :
    stars===2 ? "Great job! Try to use fewer moves next time!" :
    "Nice try! Keep practising your memory!";
  rsEl.classList.add("on");
  if(stars===3) setTimeout(bigBurst, 200);
}

function updateHUD(){
  svEl.textContent = score;
  mvEl.textContent = moves;
  tvEl.textContent = matchedPairs + "/" + totalPairs;
}

/* ---------- confetti ---------- */
var canvas=$("cc"), ctx=canvas.getContext("2d"), parts=[], rid=null;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener("resize",resize); resize();
var PCOLS=["#FF6B6B","#845EF7","#FFD166","#36C48A","#15AABF","#F07EAA","#F4793C"];

function burstAt(el){
  var r = el.getBoundingClientRect();
  spawn(14, r.left + r.width/2, r.top + r.height/2);
}
function bigBurst(){ spawn(120, innerWidth/2, 0); }
function spawn(n,x,y){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, s=2+Math.random()*5;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(y===0?0:3),
      c:PCOLS[Math.floor(Math.random()*PCOLS.length)],
      sz:6+Math.random()*8,r:Math.random()*360,rv:(Math.random()-.5)*8,l:1});
  }
  if(!rid) draw();
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  parts.forEach(function(p){
    p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.vx*=.99; p.r+=p.rv; p.l-=.014;
    ctx.save(); ctx.globalAlpha=Math.max(0,p.l);
    ctx.translate(p.x,p.y); ctx.rotate(p.r*Math.PI/180);
    ctx.fillStyle=p.c; ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);
    ctx.restore();
  });
  parts=parts.filter(function(p){return p.l>0 && p.y<canvas.height+40;});
  rid = parts.length ? requestAnimationFrame(draw) : null;
}
</script>
</body>
</html>
