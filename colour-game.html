<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colour Quest - Kids Colour Game</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FFF8F0;--panel:#FFFFFF;--ink:#2D2A3E;--muted:#7B7599;--accent:#FF6B6B;--green:#36C48A;--yellow:#FFD166;--radius:20px;--shadow:0 8px 32px rgba(45,42,62,.12)}
html,body{height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
#cc{position:fixed;inset:0;pointer-events:none;z-index:999}
header{text-align:center;padding:28px 16px 0}
header h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:900;background:linear-gradient(135deg,#FF6B6B,#845EF7,#36C48A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--muted);font-size:1.05rem;margin-top:4px}
#scorebar{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;padding:18px 16px 0}
.stat{background:var(--panel);border-radius:14px;padding:10px 22px;box-shadow:var(--shadow);text-align:center;min-width:90px}
.stat .val{font-size:1.7rem;font-weight:900;line-height:1}
.stat .lbl{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
#sv{color:#FF6B6B}#stv{color:#845EF7}#lv{color:#36C48A}
#gc{max-width:520px;margin:24px auto;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px 28px;text-align:center}
#blob{width:170px;height:170px;border-radius:50%;margin:0 auto 28px;box-shadow:0 12px 40px rgba(0,0,0,.18);transition:background .25s}
#blob.w{animation:wig .45s ease}
@keyframes wig{0%,100%{transform:rotate(0deg) scale(1)}25%{transform:rotate(-8deg) scale(1.08)}75%{transform:rotate(8deg) scale(1.08)}}
#blob.p{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
#q{font-size:1.35rem;font-weight:800;margin-bottom:24px;min-height:2.6em;line-height:1.3}
#ans{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ab{border:none;border-radius:14px;padding:18px 10px;font-family:Arial,sans-serif;font-size:1.05rem;font-weight:800;cursor:pointer;color:#fff;box-shadow:0 5px 16px rgba(0,0,0,.18);text-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s}
.ab:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.22)}
.ab:disabled{opacity:.55;cursor:default}
.ab.ok{outline:4px solid #36C48A;box-shadow:0 0 0 6px rgba(54,196,138,.25)}
.ab.no{outline:4px solid #FF6B6B;box-shadow:0 0 0 6px rgba(255,107,107,.25)}
#fb{margin-top:22px;font-size:1.3rem;font-weight:800;min-height:1.8em}
#fb.g{color:#36C48A}#fb.b{color:#FF6B6B}
#pw{margin-top:24px;background:#EDE9F6;border-radius:99px;height:10px;overflow:hidden}
#pb{height:100%;background:linear-gradient(90deg,#845EF7,#FF6B6B);border-radius:99px;transition:width .4s ease;width:0%}
#pl{font-size:.8rem;color:var(--muted);margin-top:6px;font-weight:700}
#lb{display:inline-block;background:#FFD166;color:var(--ink);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;padding:4px 12px;border-radius:99px;margin-bottom:14px}
.ov{display:none;position:fixed;inset:0;background:rgba(45,42,62,.6);z-index:100;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.ob{background:var(--panel);border-radius:24px;padding:40px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.ob h2{font-size:2rem;font-weight:900;margin-bottom:8px}
.ob p{color:var(--muted);font-size:1rem;margin-bottom:20px}
.em{font-size:4rem;display:block;margin-bottom:12px}
.bp{display:inline-block;background:linear-gradient(135deg,#845EF7,#FF6B6B);color:#fff;font-family:Arial,sans-serif;font-size:1.1rem;font-weight:900;padding:14px 38px;border-radius:14px;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(132,94,247,.35);transition:transform .15s}
.bp:hover{transform:translateY(-2px)}
#rsc{font-size:2.4rem;font-weight:900;color:#FF6B6B}
#rst{font-size:2rem;letter-spacing:4px;margin:8px 0 12px}
.dbs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.db{padding:10px 22px;border-radius:12px;border:3px solid transparent;font-family:Arial,sans-serif;font-weight:800;font-size:.95rem;cursor:pointer;transition:transform .15s}
.db:hover{transform:scale(1.06)}
.db.on{border-color:#845EF7}
.de{background:#D3F9D8;color:#2b7a3b}
.dm{background:#FFF3BF;color:#7c5a00}
.dh{background:#FFE3E3;color:#9b0000}
@media(max-width:400px){#gc{padding:22px 14px 20px}#blob{width:130px;height:130px}}
</style>
</head>
<body>
<canvas id="cc"></canvas>

<div class="ov on" id="ss">
  <div class="ob">
    <span class="em">&#127912;</span>
    <h2>Colour Quest!</h2>
    <p>Can you name all the colours? Choose your level and go!</p>
    <div class="dbs">
      <button class="db de on" data-d="easy">&#128522; Easy</button>
      <button class="db dm" data-d="medium">&#128526; Medium</button>
      <button class="db dh" data-d="hard">&#128293; Hard</button>
    </div>
    <button class="bp" id="startBtn">Let's Play! &#128640;</button>
  </div>
</div>

<div class="ov" id="rs">
  <div class="ob">
    <span class="em" id="re">&#127942;</span>
    <h2 id="rt">Game Over!</h2>
    <div id="rst">&#11088;&#11088;&#11088;</div>
    <div id="rsc">0 pts</div>
    <p id="rm">Great job!</p>
    <br>
    <button class="bp" id="againBtn">Play Again &#128260;</button>
  </div>
</div>

<header>
  <h1>&#127912; Colour Quest</h1>
  <p>Identify the colour and earn points!</p>
</header>

<div id="scorebar">
  <div class="stat"><div class="val" id="sv">0</div><div class="lbl">Score</div></div>
  <div class="stat"><div class="val" id="stv">0</div><div class="lbl">Streak &#128293;</div></div>
  <div class="stat"><div class="val" id="lv">&#10084;&#10084;&#10084;</div><div class="lbl">Lives</div></div>
</div>

<div id="gc">
  <div id="lb">Easy</div>
  <div id="blob"></div>
  <div id="q">What colour is this?</div>
  <div id="ans"></div>
  <div id="fb"></div>
  <div id="pw"><div id="pb"></div></div>
  <div id="pl">Question 1 of 10</div>
</div>

<script>
var COLOURS = {
  easy:[
    {n:"Red",h:"#E63946"},{n:"Blue",h:"#1D7FBF"},{n:"Green",h:"#2DC653"},
    {n:"Yellow",h:"#F5C400",dk:true},{n:"Orange",h:"#F4793C"},
    {n:"Pink",h:"#E8609A"},{n:"Purple",h:"#845EF7"},
    {n:"Grey",h:"#999999"},{n:"Black",h:"#333333"},{n:"Brown",h:"#7E4E2D"}
  ],
  medium:[
    {n:"Cyan",h:"#15AABF"},{n:"Magenta",h:"#CC5DE8"},
    {n:"Lime",h:"#5DAF00"},{n:"Indigo",h:"#4263EB"},
    {n:"Teal",h:"#0F9B8E"},{n:"Maroon",h:"#862E2E"},
    {n:"Gold",h:"#C98A00"},{n:"Navy",h:"#1B3A6B"},
    {n:"Olive",h:"#6B7A00"},{n:"Coral",h:"#E05050"},{n:"Violet",h:"#7950F2"}
  ],
  hard:[
    {n:"Turquoise",h:"#1ABC9C"},{n:"Crimson",h:"#DC143C"},
    {n:"Lavender",h:"#967BB6"},{n:"Scarlet",h:"#CC2000"},
    {n:"Amber",h:"#B08800"},{n:"Azure",h:"#0070EE"},
    {n:"Jade",h:"#00A86B"},{n:"Ochre",h:"#CC7722"},
    {n:"Vermilion",h:"#C83428"},{n:"Periwinkle",h:"#5555CC"}
  ]
};

var TOTAL=10, MLIVES=3, MCHOICES=4;
var BONUS={easy:10,medium:15,hard:20};
var LABEL={easy:"Easy",medium:"Medium",hard:"Hard"};

var diff="easy", pool=[], used=[], score=0, streak=0, lives=0, qnum=0, locked=false, cur=null;

function $(id){return document.getElementById(id);}
var blob=$("blob"), qEl=$("q"), ansEl=$("ans"), fbEl=$("fb");
var svEl=$("sv"), stvEl=$("stv"), lvEl=$("lv");
var pbEl=$("pb"), plEl=$("pl"), lbEl=$("lb");
var ssEl=$("ss"), rsEl=$("rs");

document.querySelectorAll(".db").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".db").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    diff=b.getAttribute("data-d");
  });
});

$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", function(){
  rsEl.classList.remove("on");
  ssEl.classList.add("on");
});

function startGame(){
  ssEl.classList.remove("on");
  score=0; streak=0; lives=MLIVES; qnum=0;
  var base = diff==="easy" ? COLOURS.easy :
             diff==="medium" ? COLOURS.easy.concat(COLOURS.medium) :
             COLOURS.easy.concat(COLOURS.medium).concat(COLOURS.hard);
  pool=shuffle(base); used=[];
  lbEl.textContent=LABEL[diff];
  updateHUD(); nextQ();
}

function nextQ(){
  locked=false; fbEl.textContent=""; fbEl.className="";
  if(qnum>=TOTAL || lives<=0){ endGame(); return; }
  qnum++;
  pbEl.style.width=((qnum-1)/TOTAL*100)+"%";
  plEl.textContent="Question "+qnum+" of "+TOTAL;
  var avail=pool.filter(function(c){
    return !used.some(function(u){return u.n===c.n;});
  });
  var src=avail.length ? avail : pool;
  cur=src[Math.floor(Math.random()*src.length)];
  used.push(cur);
  blob.style.background=cur.h;
  blob.classList.remove("w","p"); void blob.offsetWidth; blob.classList.add("p");
  qEl.textContent="What colour is this?";
  var wrong=shuffle(pool.filter(function(c){return c.n!==cur.n;})).slice(0,MCHOICES-1);
  var choices=shuffle([cur].concat(wrong));
  ansEl.innerHTML="";
  choices.forEach(function(c){
    var btn=document.createElement("button");
    btn.className="ab";
    btn.style.background=c.h;
    btn.style.color=c.dk?"#111":"#fff";
    btn.style.textShadow=c.dk?"none":"0 1px 3px rgba(0,0,0,.3)";
    btn.textContent=c.n;
    (function(cc,bb){
      bb.addEventListener("click",function(){handleAns(bb,cc);});
    })(c,btn);
    ansEl.appendChild(btn);
  });
}

function handleAns(btn,chosen){
  if(locked)return; locked=true;
  var ok=chosen.n===cur.n;
  document.querySelectorAll(".ab").forEach(function(b){
    b.disabled=true;
    if(b.textContent===cur.n) b.classList.add("ok");
    else if(b===btn && !ok) b.classList.add("no");
  });
  if(ok){
    streak++;
    var bonus=Math.min(streak-1,4)*2;
    var pts=BONUS[diff]+bonus;
    score+=pts;
    fbEl.textContent=(streak>1?"Streak x"+streak+"! ":"")+"Correct! +"+pts+" pts";
    fbEl.className="g";
    blob.classList.remove("w","p"); void blob.offsetWidth; blob.classList.add("p");
    burst();
  } else {
    streak=0; lives--;
    fbEl.textContent="It was "+cur.n+"!";
    fbEl.className="b";
    blob.classList.remove("w","p"); void blob.offsetWidth; blob.classList.add("w");
  }
  updateHUD();
  setTimeout(nextQ, 1400);
}

function endGame(){
  pbEl.style.width="100%";
  var pct=score/(TOTAL*(BONUS[diff]+8));
  var stars=pct>=.8?3:pct>=.5?2:1;
  var ss=""; for(var i=0;i<3;i++) ss+=i<stars?"⭐":"☆";
  $("re").textContent=stars===3?"🏆":stars===2?"😊":"😅";
  $("rt").textContent=stars===3?"Colour Master!":stars===2?"Great Job!":"Nice Try!";
  $("rst").textContent=ss;
  $("rsc").textContent=score+" pts";
  $("rm").textContent=stars===3?"Amazing! You are a colour expert!":
    stars===2?"Nice work! Try for a higher score!":"Keep practising!";
  rsEl.classList.add("on");
  if(stars===3) setTimeout(bigBurst,200);
}

function updateHUD(){
  svEl.textContent=score;
  stvEl.textContent=streak;
  var h=""; for(var i=0;i<MLIVES;i++) h+=i<lives?"❤️":"🖤";
  lvEl.textContent=h;
}

var canvas=$("cc"), ctx=canvas.getContext("2d"), parts=[], rid=null;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener("resize",resize); resize();
var COLS=["#FF6B6B","#845EF7","#FFD166","#36C48A","#15AABF","#F07EAA","#F4793C"];

function burst(){spawn(30,innerWidth/2,innerHeight*.35);}
function bigBurst(){spawn(120,innerWidth/2,0);}
function spawn(n,x,y){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, s=2+Math.random()*5;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(y===0?0:3),
      c:COLS[Math.floor(Math.random()*COLS.length)],
      sz:6+Math.random()*8,r:Math.random()*360,rv:(Math.random()-.5)*8,l:1});
  }
  if(!rid) draw();
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  parts.forEach(function(p){
    p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.vx*=.99; p.r+=p.rv; p.l-=.014;
    ctx.save(); ctx.globalAlpha=Math.max(0,p.l);
    ctx.translate(p.x,p.y); ctx.rotate(p.r*Math.PI/180);
    ctx.fillStyle=p.c; ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);
    ctx.restore();
  });
  parts=parts.filter(function(p){return p.l>0&&p.y<canvas.height+40;});
  rid=parts.length?requestAnimationFrame(draw):null;
}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}
</script>
</body>
</html>
