<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Colour Fun!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Helvetica Rounded', 'Arial Rounded MT Bold', Arial, sans-serif;
    background: #FFF9F0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px env(safe-area-inset-bottom, 16px);
    overflow: hidden;
  }

  header {
    text-align: center;
    padding-top: env(safe-area-inset-top, 8px);
  }

  h1 {
    font-size: 2rem;
    letter-spacing: -0.5px;
    color: #2D2D2D;
  }

  .score-bar {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 6px;
    font-size: 0.95rem;
    color: #555;
    font-weight: 600;
  }

  .score-bar span { color: #2D2D2D; }

  /* Big colour blob */
  .colour-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    flex: 1;
    justify-content: center;
  }

  .blob {
    width: min(56vw, 220px);
    height: min(56vw, 220px);
    border-radius: 50%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    transition: transform 0.15s ease, opacity 0.2s;
    animation: pop 0.35s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .question {
    font-size: 1.35rem;
    color: #2D2D2D;
    font-weight: 700;
    text-align: center;
  }

  /* Answer buttons */
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }

  .choice-btn {
    padding: 18px 8px;
    border: none;
    border-radius: 20px;
    font-size: 1.15rem;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    text-shadow: 0 1px 3px rgba(0,0,0,0.25);
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.3px;
    active-state: none;
  }

  .choice-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }

  .choice-btn.correct {
    animation: correct 0.4s ease forwards;
  }

  .choice-btn.wrong {
    animation: wrong 0.35s ease forwards;
  }

  @keyframes correct {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  @keyframes wrong {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-8px); }
    60%     { transform: translateX(8px); }
  }

  /* Result overlay */
  .result-msg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 3.5rem;
    z-index: 10;
    pointer-events: none;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
  }

  .result-msg.show {
    transform: translate(-50%, -50%) scale(1);
  }

  /* Confetti dots */
  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }

  .dot {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    opacity: 0;
    animation: fall 0.9s ease-out forwards;
  }

  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }

  /* End screen */
  .end-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex: 1;
    text-align: center;
  }

  .end-screen.show { display: flex; }
  .colour-stage.hide, .choices.hide, .score-bar.hide { display: none; }

  .end-emoji { font-size: 4rem; }

  .end-title {
    font-size: 2rem;
    font-weight: 900;
    color: #2D2D2D;
  }

  .end-sub {
    font-size: 1.1rem;
    color: #666;
  }

  .play-again {
    margin-top: 8px;
    padding: 18px 48px;
    background: #FF6B6B;
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 1.25rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 0 #cc4444;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .play-again:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #cc4444;
  }

  .stars {
    font-size: 2rem;
    letter-spacing: 6px;
  }
</style>
</head>
<body>

<header>
  <h1>🎨 Colour Fun!</h1>
  <div class="score-bar" id="scoreBar">
    <div>⭐ <span id="scoreVal">0</span></div>
    <div>🔢 <span id="qNum">1</span> / 10</div>
  </div>
</header>

<div class="colour-stage" id="stage">
  <div class="blob" id="blob"></div>
  <div class="question">What colour is this?</div>
</div>

<div class="choices" id="choices"></div>

<div class="end-screen" id="endScreen">
  <div class="end-emoji" id="endEmoji">🌟</div>
  <div class="end-title" id="endTitle">Amazing!</div>
  <div class="stars" id="endStars"></div>
  <div class="end-sub" id="endSub"></div>
  <button class="play-again" onclick="startGame()">Play Again 🎉</button>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>
<div class="result-msg" id="resultMsg"></div>

<script>
const COLOURS = [
  { name: "Red",    hex: "#E63946", btn: "#E63946" },
  { name: "Blue",   hex: "#457B9D", btn: "#457B9D" },
  { name: "Green",  hex: "#2D9D3A", btn: "#2D9D3A" },
  { name: "Yellow", hex: "#F4C430", btn: "#C8A000" },
  { name: "Orange", hex: "#F4841D", btn: "#E07010" },
  { name: "Purple", hex: "#9B5DE5", btn: "#7A3CC8" },
  { name: "Pink",   hex: "#F06C9B", btn: "#D44D80" },
  { name: "Brown",  hex: "#A0522D", btn: "#7A3A1A" },
  { name: "Black",  hex: "#2D2D2D", btn: "#1A1A1A" },
  { name: "White",  hex: "#F0F0F0", btn: "#AAAAAA" },
];

let score = 0, qIndex = 0, total = 10, locked = false, questions = [];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  score = 0; qIndex = 0; locked = false;
  questions = shuffle([...COLOURS]).slice(0, total);
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('stage').classList.remove('hide');
  document.getElementById('choices').classList.remove('hide');
  document.getElementById('scoreBar').classList.remove('hide');
  updateScore();
  nextQuestion();
}

function nextQuestion() {
  if (qIndex >= total) { endGame(); return; }

  locked = false;
  const q = questions[qIndex];

  // Animate blob
  const blob = document.getElementById('blob');
  blob.style.animation = 'none';
  blob.offsetHeight; // reflow
  blob.style.animation = '';
  blob.style.background = q.hex;

  document.getElementById('qNum').textContent = qIndex + 1;

  // Build 4 choices: correct + 3 random wrong
  const wrong = shuffle(COLOURS.filter(c => c.name !== q.name)).slice(0, 3);
  const opts = shuffle([q, ...wrong]);

  const container = document.getElementById('choices');
  container.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt.name;
    btn.style.background = opt.btn;
    btn.onclick = () => handleAnswer(btn, opt.name === q.name);
    container.appendChild(btn);
  });
}

function handleAnswer(btn, correct) {
  if (locked) return;
  locked = true;

  if (correct) {
    score++;
    btn.classList.add('correct');
    showResult('⭐', true);
    confetti();
  } else {
    btn.classList.add('wrong');
    showResult('😅', false);
    // Highlight correct answer
    document.querySelectorAll('.choice-btn').forEach(b => {
      const q = questions[qIndex];
      if (b.textContent === q.name) b.style.outline = '4px solid #2D2D2D';
    });
  }

  updateScore();
  qIndex++;
  setTimeout(() => {
    clearResult();
    nextQuestion();
  }, 900);
}

function showResult(emoji, good) {
  const el = document.getElementById('resultMsg');
  el.textContent = emoji;
  el.classList.add('show');
}

function clearResult() {
  document.getElementById('resultMsg').classList.remove('show');
}

function updateScore() {
  document.getElementById('scoreVal').textContent = score;
}

function confetti() {
  const wrap = document.getElementById('confettiWrap');
  const colors = ['#FF6B6B','#F4C430','#2D9D3A','#9B5DE5','#457B9D','#F06C9B'];
  wrap.innerHTML = '';
  for (let i = 0; i < 22; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = Math.random() * 100 + 'vw';
    dot.style.top = '0';
    dot.style.background = colors[Math.floor(Math.random() * colors.length)];
    dot.style.animationDelay = Math.random() * 0.4 + 's';
    dot.style.width = dot.style.height = (8 + Math.random() * 10) + 'px';
    wrap.appendChild(dot);
  }
  setTimeout(() => wrap.innerHTML = '', 1400);
}

function endGame() {
  document.getElementById('stage').classList.add('hide');
  document.getElementById('choices').classList.add('hide');
  document.getElementById('scoreBar').classList.add('hide');
  document.getElementById('endScreen').classList.add('show');

  const pct = score / total;
  let emoji, title, sub;
  if (pct === 1)       { emoji='🏆'; title='Perfect Score!';    sub='You know ALL the colours! Amazing!'; }
  else if (pct >= 0.7) { emoji='🌟'; title='Well Done!';        sub='You\'re a colour superstar!'; }
  else if (pct >= 0.4) { emoji='😊'; title='Good Try!';         sub='Keep practising — you\'re getting there!'; }
  else                 { emoji='🌈'; title='Keep Going!';        sub='Colours are fun — try again!'; }

  document.getElementById('endEmoji').textContent = emoji;
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endSub').textContent = `You got ${score} out of ${total}! ${sub}`;
  document.getElementById('endStars').textContent = '⭐'.repeat(Math.round(pct * 5));

  if (pct >= 0.7) confetti();
}

startGame();
</script>
</body>
</html>
