<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape Sorter - Kids Game</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FFF8F0;--panel:#FFFFFF;--ink:#2D2A3E;--muted:#7B7599;--accent:#FF6B6B;--green:#36C48A;--yellow:#FFD166;--radius:20px;--shadow:0 8px 32px rgba(45,42,62,.12)}
html,body{height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#cc{position:fixed;inset:0;pointer-events:none;z-index:999}
header{text-align:center;padding:24px 16px 0}
header h1{font-size:clamp(1.8rem,6vw,3rem);font-weight:900;background:linear-gradient(135deg,#FF6B6B,#845EF7,#36C48A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--muted);font-size:1rem;margin-top:4px}
#scorebar{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:16px 16px 0}
.stat{background:var(--panel);border-radius:14px;padding:8px 20px;box-shadow:var(--shadow);text-align:center;min-width:80px}
.stat .val{font-size:1.5rem;font-weight:900;line-height:1}
.stat .lbl{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
#sv{color:#FF6B6B}#tv{color:#845EF7}#lv{color:#36C48A}
#gc{max-width:560px;margin:20px auto;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 20px 26px;text-align:center}
#lb{display:inline-block;background:#FFD166;color:var(--ink);font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;padding:4px 12px;border-radius:99px;margin-bottom:10px}
#instr{font-size:1.1rem;font-weight:800;margin-bottom:18px}

/* board with slots */
#board{
  display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
  background:#F3F0FA;border-radius:16px;padding:20px 12px;margin-bottom:22px;
  min-height:130px;align-items:center;
}
.slot{
  width:90px;height:90px;border-radius:16px;
  border:4px dashed #C7BEE8;background:#fff;
  display:flex;align-items:center;justify-content:center;
  position:relative;transition:border-color .2s,background .2s,transform .15s;
}
.slot.over{border-color:#845EF7;background:#EDE7FB;transform:scale(1.05)}
.slot.filled{border-style:solid;border-color:#36C48A;background:#EAFBF2}
.slot svg{opacity:.28;pointer-events:none;width:60px;height:60px}
.slot.filled svg{display:none}

/* tray with draggable shapes */
#tray{
  display:flex;justify-content:center;gap:16px;flex-wrap:wrap;
  padding:14px 10px;min-height:110px;align-items:center;
}
.piece{
  width:82px;height:82px;cursor:grab;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));
  transition:transform .15s;
}
.piece:active{cursor:grabbing}
.piece.dragging{opacity:.35}
.piece.placed{visibility:hidden}
.piece svg{width:100%;height:100%}
.piece.wrong-shake{animation:shake .4s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}

/* floating drag ghost */
#ghost{
  position:fixed;pointer-events:none;z-index:500;
  width:82px;height:82px;display:none;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.25));
}
#ghost svg{width:100%;height:100%}

#feedback{margin-top:6px;font-size:1.15rem;font-weight:800;min-height:1.7em}
#feedback.g{color:var(--green)}#feedback.b{color:var(--accent)}

#pw{margin-top:18px;background:#EDE9F6;border-radius:99px;height:10px;overflow:hidden}
#pb{height:100%;background:linear-gradient(90deg,#845EF7,#FF6B6B);border-radius:99px;transition:width .4s ease;width:0%}
#pl{font-size:.78rem;color:var(--muted);margin-top:6px;font-weight:700}

.ov{display:none;position:fixed;inset:0;background:rgba(45,42,62,.6);z-index:100;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.ob{background:var(--panel);border-radius:24px;padding:36px 30px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.ob h2{font-size:1.9rem;font-weight:900;margin-bottom:8px}
.ob p{color:var(--muted);font-size:1rem;margin-bottom:18px}
.em{font-size:3.6rem;display:block;margin-bottom:10px}
.bp{display:inline-block;background:linear-gradient(135deg,#845EF7,#FF6B6B);color:#fff;font-family:Arial,sans-serif;font-size:1.05rem;font-weight:900;padding:13px 34px;border-radius:14px;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(132,94,247,.35);transition:transform .15s}
.bp:hover{transform:translateY(-2px)}
#rsc{font-size:2.2rem;font-weight:900;color:#FF6B6B}
#rst{font-size:1.9rem;letter-spacing:4px;margin:6px 0 10px}
.dbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.db{padding:9px 20px;border-radius:12px;border:3px solid transparent;font-family:Arial,sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:transform .15s}
.db:hover{transform:scale(1.06)}
.db.on{border-color:#845EF7}
.de{background:#D3F9D8;color:#2b7a3b}
.dm{background:#FFF3BF;color:#7c5a00}
.dh{background:#FFE3E3;color:#9b0000}
@media(max-width:420px){
  .slot{width:72px;height:72px}
  .slot svg{width:46px;height:46px}
  .piece{width:66px;height:66px}
  #ghost{width:66px;height:66px}
}
</style>
</head>
<body>
<canvas id="cc"></canvas>
<div id="ghost"></div>

<div class="ov on" id="ss">
  <div class="ob">
    <span class="em">&#129513;</span>
    <h2>Shape Sorter!</h2>
    <p>Drag each shape into the matching outline. Choose your level!</p>
    <div class="dbs">
      <button class="db de on" data-d="easy">&#128522; Easy</button>
      <button class="db dm" data-d="medium">&#128526; Medium</button>
      <button class="db dh" data-d="hard">&#128293; Hard</button>
    </div>
    <button class="bp" id="startBtn">Let's Play! &#128640;</button>
  </div>
</div>

<div class="ov" id="rs">
  <div class="ob">
    <span class="em" id="re">&#127942;</span>
    <h2 id="rt">Round Over!</h2>
    <div id="rst">&#11088;&#11088;&#11088;</div>
    <div id="rsc">0 pts</div>
    <p id="rm">Great job!</p>
    <br>
    <button class="bp" id="againBtn">Play Again &#128260;</button>
  </div>
</div>

<header>
  <h1>&#129513; Shape Sorter</h1>
  <p>Drag the shapes into their matching slots!</p>
</header>

<div id="scorebar">
  <div class="stat"><div class="val" id="sv">0</div><div class="lbl">Score</div></div>
  <div class="stat"><div class="val" id="tv">0</div><div class="lbl">Sorted</div></div>
  <div class="stat"><div class="val" id="lv">&#10084;&#10084;&#10084;</div><div class="lbl">Lives</div></div>
</div>

<div id="gc">
  <div id="lb">Easy</div>
  <div id="instr">Drag each shape to its matching outline</div>
  <div id="board"></div>
  <div id="tray"></div>
  <div id="feedback"></div>
  <div id="pw"><div id="pb"></div></div>
  <div id="pl">Round 1 of 8</div>
</div>

<script>
/* ---------- shape defs (SVG paths, viewBox 0 0 100 100) ---------- */
var SHAPES = {
  circle:   {name:"Circle",   svg:'<circle cx="50" cy="50" r="42"/>'},
  square:   {name:"Square",   svg:'<rect x="10" y="10" width="80" height="80" rx="8"/>'},
  triangle: {name:"Triangle", svg:'<polygon points="50,8 92,88 8,88"/>'},
  star:     {name:"Star",     svg:'<polygon points="50,4 61,37 96,37 68,58 79,92 50,71 21,92 32,58 4,37 39,37"/>'},
  heart:    {name:"Heart",    svg:'<path d="M50,88 C10,60 4,32 22,16 C34,6 48,12 50,26 C52,12 66,6 78,16 C96,32 90,60 50,88 Z"/>'},
  pentagon: {name:"Pentagon", svg:'<polygon points="50,6 95,39 78,92 22,92 5,39"/>'},
  hexagon:  {name:"Hexagon",  svg:'<polygon points="27,6 73,6 96,50 73,94 27,94 4,50"/>'},
  diamond:  {name:"Diamond",  svg:'<polygon points="50,4 92,50 50,96 8,50"/>'},
  crescent: {name:"Crescent", svg:'<path d="M62,6 A46,46 0 1 0 62,94 A36,36 0 1 1 62,6 Z"/>'},
  cross:    {name:"Cross",    svg:'<path d="M36,4 H64 V36 H96 V64 H64 V96 H36 V64 H4 V36 H36 Z"/>'}
};

var COLS = ["#E63946","#1D7FBF","#2DC653","#F4793C","#845EF7","#E8609A","#15AABF","#C98A00"];

var SETS = {
  easy:   ["circle","square","triangle","star"],
  medium: ["circle","square","triangle","star","heart","pentagon"],
  hard:   ["circle","square","triangle","star","heart","pentagon","hexagon","diamond","crescent","cross"]
};
var ROUND_SIZE = {easy:4, medium:5, hard:6};
var TOTAL_ROUNDS = 8, MLIVES = 3;
var BONUS = {easy:10, medium:15, hard:20};
var LABEL = {easy:"Easy", medium:"Medium", hard:"Hard"};

var diff="easy", roundNum=0, score=0, sortedCount=0, lives=0, locked=false;
var roundShapes=[], placedIds={};

function $(id){return document.getElementById(id);}
var boardEl=$("board"), trayEl=$("tray"), fbEl=$("feedback");
var svEl=$("sv"), tvEl=$("tv"), lvEl=$("lv");
var pbEl=$("pb"), plEl=$("pl"), lbEl=$("lb");
var ssEl=$("ss"), rsEl=$("rs"), ghostEl=$("ghost");

document.querySelectorAll(".db").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".db").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    diff=b.getAttribute("data-d");
  });
});
$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", function(){
  rsEl.classList.remove("on");
  ssEl.classList.add("on");
});

function startGame(){
  ssEl.classList.remove("on");
  score=0; sortedCount=0; lives=MLIVES; roundNum=0;
  lbEl.textContent=LABEL[diff];
  updateHUD();
  nextRound();
}

function shuffle(a){return a.slice().sort(function(){return Math.random()-.5;});}

function nextRound(){
  locked=false; fbEl.textContent=""; fbEl.className="";
  if(roundNum>=TOTAL_ROUNDS || lives<=0){ endGame(); return; }
  roundNum++;
  pbEl.style.width=((roundNum-1)/TOTAL_ROUNDS*100)+"%";
  plEl.textContent="Round "+roundNum+" of "+TOTAL_ROUNDS;

  var keys = shuffle(SETS[diff]).slice(0, ROUND_SIZE[diff]);
  var cols = shuffle(COLS);
  roundShapes = keys.map(function(k,i){
    return {id:"s"+i, key:k, color: cols[i % cols.length]};
  });
  placedIds = {};

  // build board slots (shuffled order differs from tray order)
  var slotOrder = shuffle(roundShapes);
  boardEl.innerHTML = "";
  slotOrder.forEach(function(s){
    var slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.key = s.key;
    slot.innerHTML = '<svg viewBox="0 0 100 100" fill="#845EF7">'+SHAPES[s.key].svg+'</svg>';
    boardEl.appendChild(slot);
  });

  // build tray pieces (shuffled)
  var trayOrder = shuffle(roundShapes);
  trayEl.innerHTML = "";
  trayOrder.forEach(function(s){
    var piece = document.createElement("div");
    piece.className = "piece";
    piece.dataset.id = s.id;
    piece.dataset.key = s.key;
    piece.innerHTML = '<svg viewBox="0 0 100 100" fill="'+s.color+'">'+SHAPES[s.key].svg+'</svg>';
    attachDrag(piece);
    trayEl.appendChild(piece);
  });
}

/* ---------- drag & drop (pointer events, works for touch + mouse) ---------- */
var dragState = null;

function attachDrag(piece){
  piece.addEventListener("pointerdown", function(e){
    if(locked || piece.classList.contains("placed")) return;
    e.preventDefault();
    var rect = piece.getBoundingClientRect();
    dragState = {
      piece: piece,
      offX: rect.width/2,
      offY: rect.height/2
    };
    piece.classList.add("dragging");
    var svgHTML = piece.querySelector("svg").outerHTML;
    ghostEl.innerHTML = svgHTML;
    ghostEl.style.display = "block";
    moveGhost(e.clientX, e.clientY);
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
  });
}

function moveGhost(x,y){
  ghostEl.style.left = (x - dragState.offX) + "px";
  ghostEl.style.top  = (y - dragState.offY) + "px";
}

function onPointerMove(e){
  if(!dragState) return;
  moveGhost(e.clientX, e.clientY);
  // highlight slot under pointer
  document.querySelectorAll(".slot").forEach(function(s){s.classList.remove("over");});
  var el = document.elementFromPoint(e.clientX, e.clientY);
  var slot = el ? el.closest(".slot") : null;
  if(slot && !slot.classList.contains("filled")) slot.classList.add("over");
}

function onPointerUp(e){
  if(!dragState) return;
  document.removeEventListener("pointermove", onPointerMove);
  document.removeEventListener("pointerup", onPointerUp);

  var el = document.elementFromPoint(e.clientX, e.clientY);
  var slot = el ? el.closest(".slot") : null;
  var piece = dragState.piece;

  ghostEl.style.display = "none";
  piece.classList.remove("dragging");
  document.querySelectorAll(".slot").forEach(function(s){s.classList.remove("over");});

  if(slot && !slot.classList.contains("filled")){
    checkDrop(piece, slot);
  }
  dragState = null;
}

function checkDrop(piece, slot){
  if(locked) return;
  var match = piece.dataset.key === slot.dataset.key;
  if(match){
    slot.classList.add("filled");
    var col = piece.querySelector("svg").getAttribute("fill");
    slot.innerHTML = '<svg viewBox="0 0 100 100" fill="'+col+'">'+SHAPES[slot.dataset.key].svg+'</svg>';
    piece.classList.add("placed");
    placedIds[piece.dataset.id] = true;

    score += BONUS[diff];
    sortedCount++;
    fbEl.textContent = "Great match! +" + BONUS[diff] + " pts";
    fbEl.className = "g";
    updateHUD();
    burst(slot);

    // check round complete
    var total = roundShapes.length;
    if(Object.keys(placedIds).length === total){
      locked = true;
      fbEl.textContent = "Round complete! \u2728";
      setTimeout(nextRound, 1100);
    }
  } else {
    piece.classList.add("wrong-shake");
    setTimeout(function(){piece.classList.remove("wrong-shake");}, 400);
    lives--;
    fbEl.textContent = "Not quite - try another slot!";
    fbEl.className = "b";
    updateHUD();
    if(lives<=0){
      locked = true;
      setTimeout(endGame, 900);
    }
  }
}

function endGame(){
  pbEl.style.width="100%";
  var maxScore = TOTAL_ROUNDS * ROUND_SIZE[diff] * BONUS[diff];
  // approximate maxScore per shapes actually shown; use sortedCount-based pct instead
  var pct = lives<=0 ? (sortedCount / (TOTAL_ROUNDS*ROUND_SIZE[diff])) : 1;
  if(lives>0) pct = 1;
  var stars = lives<=0 ? (pct>=.6?2:pct>=.3?1:0) : 3;
  if(stars<1) stars=1;
  var ss=""; for(var i=0;i<3;i++) ss += i<stars ? "\u2B50" : "\u2606";

  $("re").textContent = stars===3 ? "\uD83C\uDFC6" : stars===2 ? "\uD83D\uDE0A" : "\uD83D\uDE05";
  $("rt").textContent = lives<=0 ? "Out of Lives!" : "Shape Master!";
  $("rst").textContent = ss;
  $("rsc").textContent = score + " pts";
  $("rm").textContent = stars===3 ? "Amazing! You sorted every shape!" :
    stars===2 ? "Nice work! Try again for a perfect round!" :
    "Keep practising! You'll get there!";
  rsEl.classList.add("on");
  if(stars===3) setTimeout(bigBurst, 200);
}

function updateHUD(){
  svEl.textContent = score;
  tvEl.textContent = sortedCount;
  var h=""; for(var i=0;i<MLIVES;i++) h += i<lives ? "\u2764\uFE0F" : "\uD83D\uDDA4";
  lvEl.textContent = h;
}

/* ---------- confetti ---------- */
var canvas=$("cc"), ctx=canvas.getContext("2d"), parts=[], rid=null;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener("resize",resize); resize();
var PCOLS=["#FF6B6B","#845EF7","#FFD166","#36C48A","#15AABF","#F07EAA","#F4793C"];

function burst(el){
  var r = el.getBoundingClientRect();
  spawn(16, r.left + r.width/2, r.top + r.height/2);
}
function bigBurst(){ spawn(120, innerWidth/2, 0); }
function spawn(n,x,y){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, s=2+Math.random()*5;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(y===0?0:3),
      c:PCOLS[Math.floor(Math.random()*PCOLS.length)],
      sz:6+Math.random()*8,r:Math.random()*360,rv:(Math.random()-.5)*8,l:1});
  }
  if(!rid) draw();
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  parts.forEach(function(p){
    p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.vx*=.99; p.r+=p.rv; p.l-=.014;
    ctx.save(); ctx.globalAlpha=Math.max(0,p.l);
    ctx.translate(p.x,p.y); ctx.rotate(p.r*Math.PI/180);
    ctx.fillStyle=p.c; ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);
    ctx.restore();
  });
  parts=parts.filter(function(p){return p.l>0 && p.y<canvas.height+40;});
  rid = parts.length ? requestAnimationFrame(draw) : null;
}
</script>
</body>
</html>
